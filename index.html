<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nia - Opportunity Portal</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="assets/favicon/android-chrome-512x512.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="landing">
    <div class="brand">
      <div class="brand-logo-circle">
        <img src="assets/images/logo1.png" alt="Nia Logo" class="brand-logo" />
      </div>
      <p class="tagline">Information You Can Trust.</p>
      <button id="openModalBtn" class="btn btn-ghost">Get Started</button>
    </div>
  </main>

  <div id="authModal" class="modal-overlay hidden" aria-modal="true" role="dialog">
    <div class="modal">
      <button id="closeModalBtn" class="close-btn" aria-label="Close modal">&times;</button>

      <!-- Navigation Tabs -->
      <div class="tabs" id="modalTabs">
        <button id="tabSignIn" class="tab-btn active">Sign In</button>
        <button id="tabSignUp" class="tab-btn">Sign Up</button>
      </div>

      <div id="authMessage" class="message hidden"></div>

      <!-- Sign In Form -->
      <form id="signInForm" class="auth-form">
        <div class="form-group">
          <label for="signinEmail">Email</label>
          <input type="email" id="signinEmail" required placeholder="Enter your email" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signinPassword">Password</label>
          <input type="password" id="signinPassword" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div style="text-align: right; margin-top: 0.25rem; margin-bottom: 0.5rem;">
          <a href="reset-password.html" style="font-size: 0.8rem; color: #64748b; text-decoration: underline;">
            Forgot password?
          </a>
        </div>
        <button type="submit" id="signInSubmitBtn" class="btn btn-submit">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signUpForm" class="auth-form hidden">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" required placeholder="Enter a valid email address" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" minlength="6" required placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <button type="submit" id="signUpSubmitBtn" class="btn btn-submit">Create Account</button>
      </form>

      <!-- OTP Verification Form -->
      <form id="otpForm" class="auth-form hidden">
        <div class="otp-header">
          <h3 class="otp-title">Verify Your Email</h3>
          <p class="otp-desc">We sent an 8-digit code to <span id="otpTargetEmail" style="font-weight: 600;"></span></p>
        </div>

        <div class="form-group">
          <label for="otpCode" style="text-align: center;">Enter 8-Digit Code</label>
          <input 
            type="text" 
            id="otpCode" 
            inputmode="numeric" 
            maxlength="8" 
            placeholder="12345678" 
            class="otp-input" 
            required 
            autocomplete="one-time-code" 
          />
        </div>

        <button type="submit" id="verifyOtpBtn" class="btn btn-submit">Verify</button>

        <div class="otp-footer">
          <button type="button" id="resendOtpBtn" class="link-btn">Resend code</button>
          <span class="dot-separator">•</span>
          <button type="button" id="backToSignupBtn" class="link-btn">Change email</button>
        </div>
      </form>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
