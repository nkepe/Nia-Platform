<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nia - Dashboard</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="assets/favicon/android-chrome-512x512.png" />

  <link rel="stylesheet" href="dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">
      <a href="profile.html" class="nav-icon-btn" title="View Profile" aria-label="Profile">
        <img src="assets/icons/profile.svg" alt="Profile" class="nav-svg-icon" />
      </a>
    </div>
    <div class="nav-user">
      <a id="adminPortalLink" href="admin.html" class="btn btn-outline hidden">Admin Panel</a>
      <button id="logoutBtn" class="nav-icon-btn" title="Sign Out" aria-label="Sign Out">
        <img src="assets/icons/user-logout.svg" alt="Logout" class="nav-svg-icon" />
      </button>
    </div>
  </header>

  <main class="container">
    <div id="statusMessage" class="message hidden"></div>

    <section id="opportunitiesList" class="cards-grid">
      <p class="loading-text">Fetching listings...</p>
    </section>
  </main>

  <div id="welcomeModal" class="status-modal-overlay hidden" aria-modal="true" role="dialog">
    <div class="welcome-modal-box">
      <button id="closeWelcomeModal" class="modal-close-btn" aria-label="Close">&times;</button>
      <div class="welcome-logo-wrap">
        <img src="assets/images/logo2.png" alt="Welcome to Nia" class="welcome-logo" />
      </div>
      <h3 id="welcomeHeading">Welcome!</h3>
      <p>Your portal to exciting graduate roles and career opportunities is ready.</p>
      <button id="dismissWelcomeBtn" class="btn btn-primary btn-full">Get Started</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
